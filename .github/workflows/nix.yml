name: Nix

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # NOTE: fleet-nixos uses DeterminateSystems/determinate-nix-action +
      # magic-nix-cache-action, but those require FlakeHub auth. Until
      # this repo is wired into FlakeHub, use cachix's classic installer
      # which needs no external account.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check --show-trace
